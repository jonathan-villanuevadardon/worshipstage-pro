name: Publish Hostinger static branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-static-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:hostinger
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_SERVER_URL: ${{ vars.VITE_API_SERVER_URL }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://cyan-duck-221179.hostingersite.com' }}

      - name: Verify Hostinger document root
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -d dist/assets
          test -f dist/package.json
          test -f dist/package-lock.json
          test -f dist/server.mjs
          npm --prefix dist ci
          npm --prefix dist run build

      - name: Publish compiled files to hostinger branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch dist/.nojekyll
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy ${GITHUB_SHA}"
          git branch -M hostinger
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hostinger
