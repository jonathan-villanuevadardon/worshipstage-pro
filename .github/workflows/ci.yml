name: Validate application

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Hostinger output
        run: npm run build

      - name: Verify deployment files
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/apps/web/index.html
          test -f dist/apps/web/.htaccess

      - name: Upload Hostinger static artifact
        uses: actions/upload-artifact@v4
        with:
          name: worshipstage-hostinger-static
          path: dist/
          if-no-files-found: error
